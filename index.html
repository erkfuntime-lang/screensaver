<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ambient</title>
<style>
  :root { --bg: #05060a; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); overflow: hidden; cursor: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body.show-ui { cursor: default; }
  canvas { display: block; width: 100vw; height: 100vh; position: fixed; top:0; left:0; }
  #gl { display: none; }

  #hint {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px);
    left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.4); font-size: 12px; letter-spacing: 0.06em;
    text-transform: uppercase; opacity: 0; transition: opacity 0.8s ease;
    pointer-events: none; user-select: none; text-align: center; max-width: 80vw;
  }
  body.show-ui #hint { opacity: 1; }

  #controls {
    position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; padding: 6px; flex-wrap: wrap;
    max-width: 92vw; justify-content: center;
    background: rgba(15,15,20,0.5); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 18px;
    opacity: 0; transition: opacity 0.6s ease; pointer-events: none;
  }
  body.show-ui #controls { opacity: 1; pointer-events: auto; }
  #controls button {
    appearance: none; border: none; background: transparent;
    color: rgba(255,255,255,0.55); font-size: 12px; letter-spacing: 0.03em;
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
    transition: background 0.2s, color 0.2s; white-space: nowrap;
  }
  #controls button:hover { color: rgba(255,255,255,0.85); }
  #controls button.active { background: rgba(255,255,255,0.14); color: #fff; }

  #audioMsg {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: rgba(255,255,255,0.75); text-align: center; max-width: 320px;
    font-size: 14px; line-height: 1.6; display: none; z-index: 5;
  }
  #audioMsg button {
    margin-top: 14px; appearance: none; border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08); color: #fff; padding: 8px 18px;
    border-radius: 999px; font-size: 13px; cursor: pointer;
  }
  #audioMsg button:hover { background: rgba(255,255,255,0.16); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="gl"></canvas>
<div id="hint">Move to nudge, click for a new palette</div>
<div id="controls"></div>
<div id="audioMsg"></div>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const glCanvas = document.getElementById('gl');
  const controlsEl = document.getElementById('controls');
  const hintEl = document.getElementById('hint');
  const audioMsgEl = document.getElementById('audioMsg');
  let W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.max(1, Math.floor(W * DPR));
    canvas.height = Math.max(1, Math.floor(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    glCanvas.width = Math.max(1, Math.floor(W * DPR));
    glCanvas.height = Math.max(1, Math.floor(H * DPR));
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- shared helpers ----------
  const palettes = [
    ['#1b1035', '#3a1c71', '#6a1b9a', '#ff8a65'],
    ['#001f3f', '#0074D9', '#39CCCC', '#B10DC9'],
    ['#0f2027', '#203a43', '#2c5364', '#e2e2e2'],
    ['#16222a', '#3a6073', '#89f7fe', '#66a6ff'],
    ['#2b1055', '#7597de', '#ff6a88', '#ffb88c'],
    ['#0d0221', '#0f4c81', '#3fa796', '#edd382']
  ];
  let paletteIdx = 0;
  function hexToRgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n>>16)&255,(n>>8)&255,n&255]; }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function lerpColor(c1,c2,t){ return [lerp(c1[0],c2[0],t), lerp(c1[1],c2[1],t), lerp(c1[2],c2[2],t)]; }
  function paletteRGB(p){ return p.map(hexToRgb); }
  function rgbStr(c,a){ return 'rgba(' + Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+','+(a===undefined?1:a)+')'; }
  function paletteAt(pal, t) {
    t = ((t % 1) + 1) % 1;
    const scaled = t * (pal.length - 1);
    const i0 = Math.floor(scaled), i1 = Math.min(i0+1, pal.length-1);
    return lerpColor(pal[i0], pal[i1], scaled - i0);
  }

  let rgbPalette = paletteRGB(palettes[paletteIdx]);
  let targetRgbPalette = rgbPalette;
  let paletteBlend = 1;
  function cyclePalette() {
    paletteIdx = (paletteIdx + 1) % palettes.length;
    targetRgbPalette = paletteRGB(palettes[paletteIdx]);
    paletteBlend = 0;
  }
  function updatePalette(dt) {
    if (paletteBlend < 1) {
      paletteBlend = Math.min(1, paletteBlend + dt * 0.0006);
      rgbPalette = rgbPalette.map((c,i) => lerpColor(c, targetRgbPalette[i], paletteBlend));
    } else { rgbPalette = targetRgbPalette; }
  }

  function hash2(ix, iy) {
    return ((Math.sin(ix*127.1 + iy*311.7) * 43758.5453) % 1 + 1) % 1;
  }
  function noise2(x, y) {
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const xf = x-x0, yf = y-y0;
    const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
    const n00=hash2(x0,y0), n10=hash2(x0+1,y0), n01=hash2(x0,y0+1), n11=hash2(x0+1,y0+1);
    return lerp(lerp(n00,n10,u), lerp(n01,n11,u), v);
  }
  function curl2(x, y, eps) {
    const n1 = noise2(x, y+eps), n2 = noise2(x, y-eps);
    const n3 = noise2(x+eps, y), n4 = noise2(x-eps, y);
    return [ (n1-n2)/(2*eps), -(n3-n4)/(2*eps) ];
  }

  let pointer = { x: 0.5, y: 0.5 };
  let targetPointer = { x: 0.5, y: 0.5 };
  function setPointerFromEvent(e) {
    const cx = (e.touches ? e.touches[0].clientX : e.clientX);
    const cy = (e.touches ? e.touches[0].clientY : e.clientY);
    targetPointer.x = cx / W; targetPointer.y = cy / H;
    showUiBriefly();
  }
  window.addEventListener('mousemove', setPointerFromEvent, { passive: true });
  window.addEventListener('touchmove', setPointerFromEvent, { passive: true });
  window.addEventListener('touchstart', setPointerFromEvent, { passive: true });

  let uiTimeout;
  function showUiBriefly() {
    document.body.classList.add('show-ui');
    clearTimeout(uiTimeout);
    uiTimeout = setTimeout(() => document.body.classList.remove('show-ui'), 2600);
  }

  document.body.addEventListener('click', (e) => {
    if (e.target.closest('#controls') || e.target.closest('#audioMsg')) return;
    cyclePalette(); showUiBriefly();
  });

  // ---------- shared WebGL manager (one context, many programs) ----------
  const glMgr = (function () {
    let gl = null, quadBuf = null;
    function ensure() {
      if (gl) return gl;
      gl = glCanvas.getContext('webgl') || glCanvas.getContext('experimental-webgl');
      if (!gl) return null;
      quadBuf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
      return gl;
    }
    function compileProgram(vertSrc, fragSrc) {
      const g = ensure();
      if (!g) return null;
      function sh(type, src) {
        const s = g.createShader(type);
        g.shaderSource(s, src);
        g.compileShader(s);
        if (!g.getShaderParameter(s, g.COMPILE_STATUS)) { console.warn(g.getShaderInfoLog(s)); return null; }
        return s;
      }
      const vs = sh(g.VERTEX_SHADER, vertSrc);
      const fs = sh(g.FRAGMENT_SHADER, fragSrc);
      if (!vs || !fs) return null;
      const prog = g.createProgram();
      g.attachShader(prog, vs); g.attachShader(prog, fs); g.linkProgram(prog);
      if (!g.getProgramParameter(prog, g.LINK_STATUS)) { console.warn(g.getProgramInfoLog(prog)); return null; }
      return prog;
    }
    function useProgram(prog) {
      const g = ensure();
      g.useProgram(prog);
      g.bindBuffer(g.ARRAY_BUFFER, quadBuf);
      const loc = g.getAttribLocation(prog, 'aPos');
      g.enableVertexAttribArray(loc);
      g.vertexAttribPointer(loc, 2, g.FLOAT, false, 0, 0);
    }
    return { ensure, compileProgram, useProgram, get gl() { return gl; } };
  })();
  const GL_VERT = 'attribute vec2 aPos; void main(){ gl_Position = vec4(aPos,0.0,1.0); }';
  const GL_NOISE_LIB = [
    'vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x,289.0);}',
    'vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}',
    'float snoise(vec3 v){',
    '  const vec2 C = vec2(1.0/6.0,1.0/3.0);',
    '  const vec4 D = vec4(0.0,0.5,1.0,2.0);',
    '  vec3 i = floor(v+dot(v,C.yyy));',
    '  vec3 x0 = v - i + dot(i,C.xxx);',
    '  vec3 g = step(x0.yzx, x0.xyz);',
    '  vec3 l = 1.0 - g;',
    '  vec3 i1 = min(g.xyz,l.zxy);',
    '  vec3 i2 = max(g.xyz,l.zxy);',
    '  vec3 x1 = x0 - i1 + C.xxx;',
    '  vec3 x2 = x0 - i2 + C.yyy;',
    '  vec3 x3 = x0 - D.yyy;',
    '  i = mod(i, 289.0);',
    '  vec4 p = permute(permute(permute(',
    '            i.z + vec4(0.0,i1.z,i2.z,1.0))',
    '          + i.y + vec4(0.0,i1.y,i2.y,1.0))',
    '          + i.x + vec4(0.0,i1.x,i2.x,1.0));',
    '  float n_ = 1.0/7.0;',
    '  vec3 ns = n_ * D.wyz - D.xzx;',
    '  vec4 j = p - 49.0*floor(p*ns.z*ns.z);',
    '  vec4 x_ = floor(j*ns.z);',
    '  vec4 y_ = floor(j - 7.0*x_);',
    '  vec4 x = x_*ns.x + ns.yyyy;',
    '  vec4 y = y_*ns.x + ns.yyyy;',
    '  vec4 h = 1.0 - abs(x) - abs(y);',
    '  vec4 b0 = vec4(x.xy,y.xy);',
    '  vec4 b1 = vec4(x.zw,y.zw);',
    '  vec4 s0 = floor(b0)*2.0+1.0;',
    '  vec4 s1 = floor(b1)*2.0+1.0;',
    '  vec4 sh = -step(h,vec4(0.0));',
    '  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;',
    '  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;',
    '  vec3 p0 = vec3(a0.xy,h.x);',
    '  vec3 p1 = vec3(a0.zw,h.y);',
    '  vec3 p2 = vec3(a1.xy,h.z);',
    '  vec3 p3 = vec3(a1.zw,h.w);',
    '  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));',
    '  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;',
    '  vec4 m = max(0.6 - vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);',
    '  m = m*m;',
    '  return 42.0 * dot(m*m, vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));',
    '}'
  ].join('\n');

  // ---------- mode registry ----------
  const modes = {};
  let currentKey = 'glow';

  function switchMode(key) {
    if (modes[currentKey] && modes[currentKey].cleanup) modes[currentKey].cleanup();
    currentKey = key;
    audioMsgEl.style.display = 'none';
    hintEl.textContent = modes[key].hint || 'Move to nudge, click for a new palette';
    if (modes[key].init) modes[key].init();
    Array.from(controlsEl.children).forEach(b => b.classList.toggle('active', b.dataset.key === key));
    showUiBriefly();
  }

  function registerMode(key, label, def) {
    modes[key] = def;
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.dataset.key = key;
    btn.addEventListener('click', (e) => { e.stopPropagation(); switchMode(key); });
    controlsEl.appendChild(btn);
  }

  // ===================== GLOW =====================
  (function () {
    const SCALE = 0.28;
    let off, octx, blobs, particles;
    function resizeOff(){ off = document.createElement('canvas'); off.width = Math.max(1, Math.floor(W*SCALE)); off.height = Math.max(1, Math.floor(H*SCALE)); octx = off.getContext('2d', {alpha:false}); }
    function initBlobs() {
      blobs = [];
      for (let i=0;i<6;i++) blobs.push({ angle: Math.random()*Math.PI*2, radiusFactor: 0.15+Math.random()*0.25, speed: 0.00006+Math.random()*0.00008, phase: Math.random()*1000, colorT: Math.random(), size: 0.35+Math.random()*0.35, wobble: 0.5+Math.random()*1.5 });
    }
    function initParticles() {
      particles = [];
      for (let i=0;i<60;i++) particles.push({ x: Math.random(), y: Math.random(), r: 0.4+Math.random()*1.4, vx:(Math.random()-0.5)*0.00004, vy:(Math.random()-0.5)*0.00004, alpha:0.05+Math.random()*0.2, tS:0.0005+Math.random()*0.001, tP:Math.random()*1000 });
    }
    registerMode('glow', 'Glow', {
      hint: 'Move to nudge, click for a new palette',
      init(){ resizeOff(); initBlobs(); initParticles(); },
      frame(now, dt) {
        const ow=off.width, oh=off.height;
        octx.fillStyle = rgbStr(rgbPalette[0]); octx.fillRect(0,0,ow,oh);
        octx.globalCompositeOperation = 'lighter';
        for (const b of blobs) {
          b.angle += b.speed*dt;
          const wob = 1+0.15*Math.sin(now*0.0002*b.wobble+b.phase);
          const cx = (0.5+Math.cos(b.angle)*b.radiusFactor*wob+(pointer.x-0.5)*0.15)*ow;
          const cy = (0.5+Math.sin(b.angle*0.8)*b.radiusFactor*wob+(pointer.y-0.5)*0.15)*oh;
          const r = b.size*Math.max(ow,oh)*(0.5+0.15*Math.sin(now*0.00015+b.phase));
          const c = paletteAt(rgbPalette, b.colorT);
          const grad = octx.createRadialGradient(cx,cy,0,cx,cy,r);
          grad.addColorStop(0, rgbStr(c,0.55)); grad.addColorStop(1, rgbStr(c,0));
          octx.fillStyle = grad; octx.beginPath(); octx.arc(cx,cy,r,0,Math.PI*2); octx.fill();
          b.colorT += 0.00003*dt;
        }
        octx.globalCompositeOperation = 'source-over';
        for (const p of particles) {
          p.x += p.vx*dt; p.y += p.vy*dt;
          if (p.x<0)p.x=1; if(p.x>1)p.x=0; if(p.y<0)p.y=1; if(p.y>1)p.y=0;
          const tw = 0.5+0.5*Math.sin(now*p.tS+p.tP);
          octx.fillStyle = 'rgba(255,255,255,'+(p.alpha*tw).toFixed(3)+')';
          octx.beginPath(); octx.arc(p.x*ow,p.y*oh,p.r,0,Math.PI*2); octx.fill();
        }
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality='high';
        ctx.drawImage(off,0,0,ow,oh,0,0,W,H);
      }
    });
    window.addEventListener('resize', () => { if (currentKey==='glow') resizeOff(); });
  })();

  // ===================== AURORA 2.0 (volumetric raymarch) =====================
  (function () {
    let prog = null, uniforms = {}, ready = false, startTime = null;
    const FRAG = 'precision highp float;\n' +
'uniform vec2 u_resolution;\n' +
'uniform float u_time;\n' +
'uniform vec2 u_pointer;\n' +
'uniform vec3 u_pal0; uniform vec3 u_pal1; uniform vec3 u_pal2; uniform vec3 u_pal3;\n' +
GL_NOISE_LIB + '\n' +
'float hash1(float n){ return fract(sin(n)*43758.5453); }\n' +
'vec3 skyBg(vec3 rd){\n' +
'  float az = atan(rd.x, -rd.z);\n' +
'  float el = rd.y;\n' +
'  vec2 sc = vec2(az*6.0, el*14.0);\n' +
'  vec2 id = floor(sc);\n' +
'  vec2 gv = fract(sc)-0.5;\n' +
'  float n = hash1(id.x*127.1+id.y*311.7);\n' +
'  float starSize = smoothstep(0.06,0.0, length(gv));\n' +
'  float star = step(0.965,n)*starSize*(0.6+0.4*sin(u_time*3.0+n*80.0));\n' +
'  vec3 base = mix(vec3(0.008,0.009,0.022), vec3(0.015,0.017,0.045), el*0.5+0.5);\n' +
'  return base + vec3(star);\n' +
'}\n' +
'float meteors(vec3 rd){\n' +
'  float az = atan(rd.x, -rd.z);\n' +
'  float el = rd.y;\n' +
'  vec2 sky = vec2(az*6.0, el*14.0);\n' +
'  float total = 0.0;\n' +
'  for(int m=0;m<4;m++){\n' +
'    float fm = float(m);\n' +
'    float seed = fm*17.3;\n' +
'    float period = 4.5 + hash1(seed)*3.5;\n' +
'    float cyc = mod(u_time*0.35 + fm*2.9, period) / period;\n' +
'    float active = smoothstep(0.0,0.02,cyc) * (1.0-smoothstep(0.1,0.2,cyc));\n' +
'    if (active <= 0.001) continue;\n' +
'    float startX = (hash1(seed+1.0)-0.5)*40.0;\n' +
'    float startY = 6.0+hash1(seed+2.0)*6.0;\n' +
'    float ang = -0.9 + (hash1(seed+3.0)-0.5)*0.5;\n' +
'    vec2 dir = vec2(cos(ang), sin(ang));\n' +
'    float travel = clamp(cyc/0.2, 0.0, 1.0)*22.0;\n' +
'    vec2 head = vec2(startX,startY) + dir*travel;\n' +
'    vec2 toPix = sky - head;\n' +
'    float trailLen = 9.0;\n' +
'    float proj = clamp(dot(-toPix, dir), 0.0, trailLen);\n' +
'    vec2 closest = head - dir*proj;\n' +
'    float d = length(sky - closest);\n' +
'    float fade = 1.0 - proj/trailLen;\n' +
'    float glow = exp(-d*d*55.0) * fade * fade * active;\n' +
'    float headGlow = exp(-length(sky-head)*length(sky-head)*75.0) * active;\n' +
'    total += glow*0.7 + headGlow*1.0;\n' +
'  }\n' +
'  return total;\n' +
'}\n' +
'float ribbon(vec3 p, float fi, float xOffset){\n' +
'  float shapeBase = sin(p.y*0.35+fi*2.3)*1.1 + sin(p.y*0.9+fi*1.7)*0.35;\n' +
'  float warp = snoise(vec3(p.x*0.08+fi*3.0, p.y*0.04, u_time*0.02+fi*10.0))*0.3;\n' +
'  float drift = sin(u_time*0.03+fi)*0.25;\n' +
'  float sheetX = shapeBase + warp + drift + xOffset + u_pointer.x*1.2;\n' +
'  float distX = p.x - sheetX;\n' +
'  float core = exp(-distX*distX*11.0);\n' +
'  float halo = exp(-distX*distX*1.8)*0.28;\n' +
'  float shape = core + halo;\n' +
'  float rayN = snoise(vec3(p.x*0.6, p.y*0.35, u_time*0.08+fi*7.0));\n' +
'  float rays = 0.55+0.45*sin(p.x*10.0 + p.y*1.6 + fi*4.0 + rayN*2.5);\n' +
'  shape *= mix(0.65,1.0,rays);\n' +
'  float bandCenter = 1.15 + fi*0.55;\n' +
'  float bandWidth = 0.85;\n' +
'  float ty = (p.y-bandCenter)/bandWidth;\n' +
'  float heightMask = exp(-ty*ty);\n' +
'  float flicker = 0.65+0.35*sin(u_time*0.8+p.z*0.5+fi*5.0);\n' +
'  return shape*heightMask*flicker;\n' +
'}\n' +
'float auroraDensity(vec3 p){\n' +
'  float d = 0.0;\n' +
'  d += ribbon(p, 0.0, -0.9);\n' +
'  d += ribbon(p, 1.0, 0.5)*0.85;\n' +
'  d += ribbon(p, 2.0, 1.9)*0.6;\n' +
'  return d;\n' +
'}\n' +
'void main(){\n' +
'  vec2 uv = (gl_FragCoord.xy - 0.5*u_resolution)/u_resolution.y;\n' +
'  vec3 ro = vec3(0.0, -0.3, 0.0);\n' +
'  vec3 rd = normalize(vec3(uv.x, uv.y+0.55, -1.3));\n' +
'  vec3 bg = skyBg(rd);\n' +
'  vec3 col = vec3(0.0);\n' +
'  float alpha = 0.0;\n' +
'  float t = 0.3;\n' +
'  for(int i=0;i<90;i++){\n' +
'    if (alpha > 0.97 || t > 9.0) break;\n' +
'    vec3 p = ro + rd*t;\n' +
'    if (p.y > 0.0) {\n' +
'      float dens = auroraDensity(p);\n' +
'      if (dens > 0.006) {\n' +
'        float heightT = clamp((p.y-0.3)/2.0, 0.0, 1.0);\n' +
'        vec3 c = mix(u_pal1, u_pal2, smoothstep(0.0,0.55,heightT));\n' +
'        c = mix(c, u_pal3, smoothstep(0.7,1.0,heightT));\n' +
'        float punch = pow(clamp(dens,0.0,2.0), 1.4);\n' +
'        float stepA = clamp(punch*0.22, 0.0, 1.0);\n' +
'        col += (1.0-alpha)*stepA*c*(0.8+punch*0.6);\n' +
'        alpha += (1.0-alpha)*stepA;\n' +
'      }\n' +
'    }\n' +
'    t += 0.09;\n' +
'  }\n' +
'  vec3 result = mix(bg, col, alpha);\n' +
'  float mtr = meteors(rd);\n' +

  (function () {

    function resizeOff() {

    function computeFractal(now) {
      const ow = off.width, oh = off.height;
      const cycle = 24000;
      const tphase = (now % cycle) / cycle;
      const zoom = Math.pow(2000, tphase);
      const maxIter = Math.min(280, 60 + Math.floor(tphase*260));
      const scale = 3.0 / zoom;
      imgData = octx.createImageData(ow, oh);
      const data = imgData.data;
      const hueShift = now*0.00002;
      for (let py=0; py<oh; py++) {
        const y0 = targetCy + (py/oh - 0.5) * scale * (oh/ow);

          const x0 = targetCx + (px/ow - 0.5) * scale;
          let x=0, y=0, iter=0;
          while (x*x+y*y <= 4 && iter < maxIter) {
            const xt = x*x - y*y + x0;
            y = 2*x*y + y0; x = xt; iter++;

          const idx = (py*ow+px)*4;
          if (iter === maxIter) { data[idx]=4; data[idx+1]=5; data[idx+2]=10; data[idx+3]=255; }

            const t = (iter/maxIter + hueShift) % 1;
            const col = paletteAt(rgbPalette, t);
            data[idx]=col[0]; data[idx+1]=col[1]; data[idx+2]=col[2]; data[idx+3]=255;

      hint: 'Fractal zoom, click for a new palette',

          grad.addColorStop(0, 'rgba(200,215,232,0)');
          grad.addColorStop(1, 'rgba(200,215,232,'+a.toFixed(3)+')');
          ctx.strokeStyle = grad;
          ctx.lineWidth = LAYERS[d.layer].width;
          ctx.beginPath(); ctx.moveTo(tailX,tailY); ctx.lineTo(d.x,d.y); ctx.stroke();
        }

        for (let i=splashes.length-1;i>=0;i--) {
          const s = splashes[i];
          s.life += dt;
          const t = s.life/s.maxLife;
          if (t >= 1) { splashes.splice(i,1); continue; }
          const r = s.size*(1+t*3);
          const alpha = (1-t)*0.5;
          ctx.strokeStyle = 'rgba(210,225,240,'+alpha.toFixed(3)+')';
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.ellipse(s.x, s.y, r, r*0.32, 0, 0, Math.PI*2); ctx.stroke();
        }

        if (now > nextBoltAt) {
          spawnBolt();
          if (Math.random() < 0.25) spawnBolt();
          nextBoltAt = now + 1400 + Math.random()*3200;
        }
        ctx.globalCompositeOperation = 'lighter';
        for (let bi=bolts.length-1; bi>=0; bi--) {
          const bolt = bolts[bi];
          bolt.life += dt;
          const lifeT = bolt.life / bolt.maxLife;
          if (lifeT >= 1) { bolts.splice(bi,1); continue; }
          const flicker = 0.5 + 0.5*Math.sin(now*0.09 + bi*3.1);
          const fade = Math.pow(1-lifeT, 1.6);
          const alpha = fade * (0.6+0.4*flicker);
          const c = paletteAt(rgbPalette, 0.55 + 0.15*Math.sin(now*0.001+bi));
          const glowCol = lerpColor(c, [255,255,255], 0.3);
          for (const path of bolt.paths) {
            ctx.strokeStyle = rgbStr(glowCol, alpha*0.18);
            ctx.lineWidth = 7;
            ctx.beginPath();
            ctx.moveTo(path[0][0], path[0][1]);
            for (let i=1;i<path.length;i++) ctx.lineTo(path[i][0], path[i][1]);
            ctx.stroke();

            ctx.strokeStyle = rgbStr([255,255,255], Math.min(1,alpha*1.1));
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(path[0][0], path[0][1]);
            for (let i=1;i<path.length;i++) ctx.lineTo(path[i][0], path[i][1]);
            ctx.stroke();
          }
        }
        ctx.globalCompositeOperation = 'source-over';
      }
    });
    window.addEventListener('resize', () => { if (currentKey==='lightning') initRain(); });
  })();

  // ===================== BOIDS FLOCKING =====================
  (function () {
    let boids = [];
    const COUNT = 180;
    const PERCEPTION = 55;
    let grid = {};
    let cellSize = PERCEPTION;

    function initBoids() {
      boids = [];
      for (let i=0;i<COUNT;i++) {
        const angle = Math.random()*Math.PI*2;
        boids.push({ x: Math.random()*W, y: Math.random()*H, vx: Math.cos(angle)*1.2, vy: Math.sin(angle)*1.2, t: Math.random() });
      }
    }
    function cellKey(cx,cy){ return cx+','+cy; }
    function buildGrid() {
      grid = {};
      for (const b of boids) {
        const cx = Math.floor(b.x/cellSize), cy = Math.floor(b.y/cellSize);
        const key = cellKey(cx,cy);
        if (!grid[key]) grid[key] = [];
        grid[key].push(b);
      }
    }
    function neighbors(b) {
      const cx = Math.floor(b.x/cellSize), cy = Math.floor(b.y/cellSize);
      const result = [];
      for (let dx=-1; dx<=1; dx++) {
        for (let dy=-1; dy<=1; dy++) {
          const arr = grid[cellKey(cx+dx,cy+dy)];
          if (arr) for (const o of arr) if (o!==b) result.push(o);
        }
      }
      return result;
    }
    registerMode('boids', 'Boids', {
      hint: 'Boids flocking, click for a new palette',
      init(){ initBoids(); ctx.fillStyle = '#05060a'; ctx.fillRect(0,0,W,H); },
      frame(now, dt) {
        ctx.fillStyle = 'rgba(5,6,10,0.12)';
        ctx.fillRect(0,0,W,H);
        buildGrid();
        const maxSpeed = 2.4, maxForce = 0.05;
        for (const b of boids) {
          let sepX=0, sepY=0, aliX=0, aliY=0, cohX=0, cohY=0, count=0;
          const near = neighbors(b);
          for (const o of near) {
            const dx=b.x-o.x, dy=b.y-o.y;
            const d2 = dx*dx+dy*dy;
            if (d2 < PERCEPTION*PERCEPTION && d2>0.0001) {
              const d = Math.sqrt(d2);
              if (d < PERCEPTION*0.45) { sepX += dx/d; sepY += dy/d; }
              aliX += o.vx; aliY += o.vy;
              cohX += o.x; cohY += o.y;
              count++;
            }
          }
          let ax=0, ay=0;
          if (count>0) {
            aliX/=count; aliY/=count;
            const aliLen = Math.hypot(aliX,aliY)||1;
            ax += (aliX/aliLen*maxSpeed - b.vx) * 0.06;
            ay += (aliY/aliLen*maxSpeed - b.vy) * 0.06;
            cohX/=count; cohY/=count;
            ax += (cohX-b.x) * 0.0006;
            ay += (cohY-b.y) * 0.0006;
            ax += sepX * 0.04;
            ay += sepY * 0.04;
          }
          ax += (pointer.x*W - b.x) * 0.0000;
          const fmag = Math.hypot(ax,ay);
          if (fmag > maxForce) { ax = ax/fmag*maxForce; ay = ay/fmag*maxForce; }
          b.vx += ax; b.vy += ay;
          const speed = Math.hypot(b.vx,b.vy)||0.001;
          if (speed > maxSpeed) { b.vx = b.vx/speed*maxSpeed; b.vy = b.vy/speed*maxSpeed; }
          if (speed < 0.6) { b.vx = b.vx/speed*0.6; b.vy = b.vy/speed*0.6; }
          b.x += b.vx*(dt*0.06); b.y += b.vy*(dt*0.06);
          if (b.x < -10) b.x = W+10; if (b.x > W+10) b.x = -10;
          if (b.y < -10) b.y = H+10; if (b.y > H+10) b.y = -10;
        }
        ctx.globalCompositeOperation = 'lighter';
        for (const b of boids) {
          const speed = Math.hypot(b.vx,b.vy);
          const c = paletteAt(rgbPalette, b.t + speed*0.05);
          const angle = Math.atan2(b.vy,b.vx);
          const len = 6+speed*1.5;
          const tx = b.x - Math.cos(angle)*len, ty = b.y - Math.sin(angle)*len;
          const grad = ctx.createLinearGradient(tx,ty,b.x,b.y);
          grad.addColorStop(0, rgbStr(c,0));
          grad.addColorStop(1, rgbStr(c,0.85));
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(b.x,b.y); ctx.stroke();
        }
        ctx.globalCompositeOperation = 'source-over';
      }
    });
  })();

  // ===================== AUDIO REACTIVE =====================
  (function () {
    let audioCtx, analyser, dataArray, stream, bufferLength;
    let connected = false;
    let bars = 64;
    let smoothed = [];

    function showMessage(html) { audioMsgEl.innerHTML = html; audioMsgEl.style.display = 'block'; }
    function hideMessage() { audioMsgEl.style.display = 'none'; }

    async function trySystemAudio() {
      try {
        stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        const audioTracks = stream.getAudioTracks();
        stream.getVideoTracks().forEach(function(t){ t.stop(); });
        if (audioTracks.length === 0) throw new Error('no-audio-track');
        setupAnalyser(stream);
      } catch (err) {
        showMessage('Could not capture system audio (browser support or permission).<br><button id="tryMic">Try microphone instead</button>');
        document.getElementById('tryMic').addEventListener('click', tryMic);
      }
    }
    async function tryMic() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        setupAnalyser(stream);
      } catch (err) {
        showMessage('No audio access available in this browser or context.<br>Showing a simulated pulse instead.');
      }
    }
    function setupAnalyser(s) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(s);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      bufferLength = analyser.frequencyBinCount;
      dataArray = new Uint8Array(bufferLength);
      source.connect(analyser);
      connected = true;
      hideMessage();
    }
    function cleanupAudio() {
      if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
      if (audioCtx) { audioCtx.close(); audioCtx = null; }
      connected = false;
      hideMessage();
    }

    registerMode('audio', 'Audio', {
      hint: 'Audio-reactive, needs mic or system-audio permission',
      init() {
        smoothed = new Array(bars).fill(0);
        showMessage('React to sound in the room, or share a tab or screen with audio.<br><button id="startAudioBtn">Enable system audio</button><br><button id="startMicBtn" style="margin-top:6px;">Use microphone</button>');
        document.getElementById('startAudioBtn').addEventListener('click', trySystemAudio);
        document.getElementById('startMicBtn').addEventListener('click', tryMic);
      },
      cleanup() { cleanupAudio(); },
      frame(now, dt) {
        ctx.fillStyle = 'rgba(5,6,10,0.35)';
        ctx.fillRect(0,0,W,H);
        const cx = W/2, cy = H/2;
        const baseR = Math.min(W,H)*0.18;
        let levels;
        if (connected && analyser) {
          analyser.getByteFrequencyData(dataArray);
          levels = [];
          const bucket = Math.floor(bufferLength / bars);
          for (let i=0;i<bars;i++) {
            let sum=0;
            for (let j=0;j<bucket;j++) sum += dataArray[i*bucket+j] || 0;
            levels.push((sum/bucket)/255);
          }
        } else {
          levels = [];
          for (let i=0;i<bars;i++) levels.push(0.15 + 0.12*Math.sin(now*0.0025 + i*0.4));
        }
        ctx.globalCompositeOperation = 'lighter';
        for (let i=0;i<bars;i++) {
          smoothed[i] = lerp(smoothed[i], levels[i], 0.35);
          const angle = (i/bars) * Math.PI*2;
          const len = baseR * 0.6 + smoothed[i]*baseR*2.2;
          const x1 = cx + Math.cos(angle)*baseR*0.7;
          const y1 = cy + Math.sin(angle)*baseR*0.7;
          const x2 = cx + Math.cos(angle)*(baseR*0.7+len);
          const y2 = cy + Math.sin(angle)*(baseR*0.7+len);
          const c = paletteAt(rgbPalette, i/bars);
          ctx.strokeStyle = rgbStr(c, 0.75);
          ctx.lineWidth = Math.max(1.5, (Math.min(W,H)/bars)*0.6);
          ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
        }
        ctx.globalCompositeOperation = 'source-over';
      }
    });
  })();

  // ---------- main loop ----------
  let t0 = performance.now();
  function loop(now) {
    const dt = now - t0; t0 = now;
    updatePalette(dt);
    const m = modes[currentKey];
    if (m && m.frame) m.frame(now, dt);
    requestAnimationFrame(loop);
  }

  switchMode('glow');
  showUiBriefly();
  requestAnimationFrame(loop);
})();
</script>
